<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Monitoreo SAMEE200</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 950px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }

        .value {
            font-size: 2.4rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .temp {
            color: #007bff;
        }

        .humidity {
            color: #17a2b8;
        }

        .label {
            font-size: 0.95rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===========================
           INDICADORES
           =========================== */

        .indicators {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .indicator-card {
            padding: 20px;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .indicator {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            margin: 15px auto 10px auto;
            background-color: #777;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

        .indicator.red {
            background-color: #dc3545;
            box-shadow: 0 0 15px rgba(220,53,69,0.8);
        }

        .indicator.green {
            background-color: #28a745;
            box-shadow: 0 0 15px rgba(40,167,69,0.7);
        }

        .indicator.off {
            background-color: #6c757d;
            box-shadow: none;
        }

        .state-text {
            font-size: 1.15rem;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 25px;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #777;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .indicators {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Monitoreo JPCE</h1>

    <!-- ======================================
         VARIABLES ANALÓGICAS / MEDIDAS
         ====================================== -->

    <div class="grid">

        <div class="card">

            <div class="label">
                SoC Raspberry Pi
            </div>

            <div
                class="value temp"
                id="soc_val">

                -- °C

            </div>

        </div>


        <div class="card">

            <div class="label">
                Temperatura Ambiente
            </div>

            <div
                class="value temp"
                id="amb_val">

                -- °C

            </div>

        </div>


        <div class="card">

            <div class="label">
                Humedad
            </div>

            <div
                class="value humidity"
                id="hum_val">

                -- %

            </div>

        </div>

    </div>


    <!-- ======================================
         INDICADORES DIGITALES
         ====================================== -->

    <div class="indicators">


        <!-- PUERTA -->

        <div class="indicator-card">

            <div class="label">
                Puerta
            </div>

            <div
                id="door_indicator"
                class="indicator off">
            </div>

            <div
                id="door_text"
                class="state-text">

                --

            </div>

        </div>


        <!-- PILOTO -->

        <div class="indicator-card">

            <div class="label">
                Piloto
            </div>

            <div
                id="pilot_indicator"
                class="indicator off">
            </div>

            <div
                id="pilot_text"
                class="state-text">

                OFF

            </div>

        </div>


        <!-- VENTILADOR -->

        <div class="indicator-card">

            <div class="label">
                Ventilador
            </div>

            <div
                id="fan_indicator"
                class="indicator off">
            </div>

            <div
                id="fan_text"
                class="state-text">

                OFF

            </div>

        </div>

    </div>


    <!-- ======================================
         GRÁFICA
         ====================================== -->

    <div class="chart-container">

        <canvas id="liveChart"></canvas>

    </div>


    <div id="status">

        Esperando conexión...

    </div>


</div>


<script>

    // ==========================================
    // GRÁFICA
    // ==========================================

    const ctx =
        document
        .getElementById('liveChart')
        .getContext('2d');


    const liveChart = new Chart(ctx, {

        type: 'line',

        data: {

            labels: [],

            datasets: [

                {

                    label: 'SoC (°C)',

                    borderColor: '#dc3545',

                    backgroundColor:
                        'rgba(220,53,69,0.1)',

                    data: [],

                    fill: true,

                    tension: 0.3
                },

                {

                    label:
                        'Ambiente (°C)',

                    borderColor:
                        '#0d6efd',

                    backgroundColor:
                        'rgba(13,110,253,0.1)',

                    data: [],

                    fill: true,

                    tension: 0.3
                }

            ]
        },


        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                x: {

                    ticks: {

                        maxTicksLimit: 10

                    }
                }
            }
        }

    });


    // ==========================================
    // ACTUALIZAR INDICADORES
    // ==========================================

    function actualizarIndicadores(last) {

        // --------------------------------------
        // PUERTA
        // --------------------------------------

        const doorIndicator =
            document.getElementById(
                'door_indicator'
            );

        const doorText =
            document.getElementById(
                'door_text'
            );


        if (last.door_closed === true) {

            doorIndicator.className =
                'indicator green';

            doorText.innerText =
                'CERRADA';

        }

        else if (last.door_closed === false) {

            doorIndicator.className =
                'indicator red';

            doorText.innerText =
                'ABIERTA';

        }

        else {

            doorIndicator.className =
                'indicator off';

            doorText.innerText =
                'SIN DATOS';

        }


        // --------------------------------------
        // PILOTO
        // --------------------------------------

        const pilotIndicator =
            document.getElementById(
                'pilot_indicator'
            );

        const pilotText =
            document.getElementById(
                'pilot_text'
            );


        if (last.pilot_on === true) {

            pilotIndicator.className =
                'indicator red';

            pilotText.innerText =
                'ON';

        }

        else {

            pilotIndicator.className =
                'indicator off';

            pilotText.innerText =
                'OFF';

        }


        // --------------------------------------
        // VENTILADOR
        // --------------------------------------

        const fanIndicator =
            document.getElementById(
                'fan_indicator'
            );

        const fanText =
            document.getElementById(
                'fan_text'
            );


        if (last.fan_on === true) {

            fanIndicator.className =
                'indicator red';

            fanText.innerText =
                'ON';

        }

        else {

            fanIndicator.className =
                'indicator off';

            fanText.innerText =
                'OFF';

        }

    }


    // ==========================================
    // LEER API
    // ==========================================

    function fetchData() {

        fetch('/history')

            .then(
                response =>
                    response.json()
            )

            .then(data => {

                if (
                    data &&
                    data.length > 0
                ) {

                    const recentData =
                        data.slice(-30);

                    const last =
                        recentData[
                            recentData.length - 1
                        ];


                    // ==================================
                    // VALORES ACTUALES
                    // ==================================

                    document
                        .getElementById(
                            'soc_val'
                        )
                        .innerText =
                            last.soc_temp
                            .toFixed(2)
                            + ' °C';


                    document
                        .getElementById(
                            'amb_val'
                        )
                        .innerText =
                            last.ambient_temp
                            .toFixed(2)
                            + ' °C';


                    document
                        .getElementById(
                            'hum_val'
                        )
                        .innerText =
                            last.humidity
                            .toFixed(2)
                            + ' %';


                    // ==================================
                    // INDICADORES
                    // ==================================

                    actualizarIndicadores(
                        last
                    );


                    // ==================================
                    // HORA DE ACTUALIZACIÓN
                    // ==================================

                    document
                        .getElementById(
                            'status'
                        )
                        .innerText =
                            'Última lectura: '
                            + last.timestamp;


                    // ==================================
                    // GRÁFICA
                    // ==================================

                    const labels =
                        recentData.map(
                            d => {

                                const date =
                                    new Date(
                                        d.timestamp
                                    );

                                return date
                                    .toLocaleTimeString(
                                        [],
                                        {
                                            hour:
                                                '2-digit',

                                            minute:
                                                '2-digit',

                                            second:
                                                '2-digit'
                                        }
                                    );
                            }
                        );


                    const socTemps =
                        recentData.map(
                            d =>
                                d.soc_temp
                        );


                    const ambTemps =
                        recentData.map(
                            d =>
                                d.ambient_temp
                        );


                    liveChart.data.labels =
                        labels;


                    liveChart
                        .data
                        .datasets[0]
                        .data =
                            socTemps;


                    liveChart
                        .data
                        .datasets[1]
                        .data =
                            ambTemps;


                    liveChart.update();

                }

            })

            .catch(error => {

                document
                    .getElementById(
                        'status'
                    )
                    .innerText =
                        'Desconectado del servidor';

            });

    }


    // ==========================================
    // ACTUALIZACIÓN AUTOMÁTICA
    // ==========================================

    fetchData();

    setInterval(
        fetchData,
        3000
    );

</script>

</body>

</html>
